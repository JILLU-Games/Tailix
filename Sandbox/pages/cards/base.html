<div class="vib-card-demo-grid">
  <article class="vib-card vib-card-pad">
    <div class="vib-row justify-between">
      <h3 class="vib-card-title">Base deployment card</h3>
      <span class="vib-badge">Default</span>
    </div>
    <p class="vib-card-text mt-2">Flat bordered surface with compact body copy, zero shadow, primary and secondary actions.</p>
    <div class="vib-card-demo-actions">
      <button class="vib-button vib-button-primary" type="button">Deploy</button>
      <button class="vib-button vib-button-secondary" type="button">Preview</button>
    </div>
  </article>
  <article class="vib-card vib-card-pad" aria-selected="true">
    <div class="vib-row justify-between">
      <h3 class="vib-card-title">Selected base state</h3>
      <span class="vib-badge">Selected</span>
    </div>
    <p class="vib-card-text mt-2">Selected/active treatment uses a crisp border only; it does not use glow or shadow elevation.</p>
    <div class="vib-card-demo-actions"><button class="vib-button vib-button-secondary" type="button">Open</button></div>
  </article>
</div>
